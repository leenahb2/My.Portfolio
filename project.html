<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details | Leena Bahweny</title>
    <meta
      name="description"
      content="Detailed project case study for Leena Bahweny's portfolio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=layout-36" />
  </head>
  <body class="detail-page">
    <canvas id="neon-field" aria-hidden="true"></canvas>
    <div class="scanline" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Back to home">
        <span class="brand-mark">LB</span>
        <span>Leena Bahweny</span>
      </a>

      <nav class="nav-links" aria-label="Project navigation">
        <a href="index.html#projects">Projects</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main class="project-detail-shell">
      <section class="project-detail-layout reveal">
        <article class="project-detail-copy">
          <div class="detail-nav">
            <a class="back-link" href="index.html#projects">← Back to projects</a>
          </div>
          <p class="eyebrow" id="project-category">Project</p>
          <h1 id="project-title">Project Name</h1>
          <h2 class="project-detail-subtitle" id="project-subtitle">Project subtitle</h2>
          <p class="project-detail-description" id="project-description"></p>

          <p class="project-section-label">Project Highlights</p>
          <div class="detail-list" id="project-details"></div>

          <div class="project-feature-block" id="project-feature-block" hidden>
            <p class="project-section-label">Key Features</p>
            <div class="project-features" id="project-features"></div>
          </div>

          <div class="project-detail-footer">
            <div class="project-tags detail-tags" id="project-tags"></div>
            <a class="next-project-card" id="next-project-link" href="#">Next project →</a>
          </div>
        </article>

        <aside class="project-gallery" aria-label="Project media carousel">
          <div class="gallery-frame">
            <div class="gallery-track" id="gallery-track"></div>
          </div>

          <div class="gallery-controls">
            <button class="gallery-button" type="button" data-gallery-prev aria-label="Previous media">
              ←
            </button>
            <div class="gallery-dots" id="gallery-dots" aria-label="Media position"></div>
            <button class="gallery-button" type="button" data-gallery-next aria-label="Next media">
              →
            </button>
          </div>
        </aside>
      </section>
    </main>

    <script src="project-data.js?v=content-2"></script>
    <script src="script.js?v=perf-4"></script>
    <script src="project.js?v=features-1"></script>
  </body>
</html>
